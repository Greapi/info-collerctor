services:
  rsshub:
    image: ${RSSHUB_IMAGE:-diygod/rsshub:latest}
    container_name: ${RSSHUB_CONTAINER_NAME:-info-collector-rsshub}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.rsshub
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://127.0.0.1:6379/
      PUPPETEER_WS_ENDPOINT: ws://127.0.0.1:3000
      PROXY_URI: http://127.0.0.1:7897
      LISTEN_INADDR_ANY: "false"
    depends_on:
      redis:
        condition: service_healthy
      browserless:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  browserless:
    image: ${BROWSERLESS_IMAGE:-browserless/chrome:latest}
    container_name: ${BROWSERLESS_CONTAINER_NAME:-info-collector-browserless}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    ulimits:
      core:
        hard: 0
        soft: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-info-collector-redis}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - rsshub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  rsshub-redis-data:
